
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Business Card</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="business-card">
        <div class="top-label">DIGITAL BUSINESS CARD</div>

        <div class="profile">
            <div class="avatar">YN</div>
            <p class="eyebrow">NICE TO MEET YOU</p>
            <h1>Your Name</h1>
            <p class="job-title">Your Profession</p>
            <p class="bio">
                Building connections and creating opportunities.
            </p>
        </div>

        <div class="divider"></div>

        <section class="contact-section">
            <h2>Let's connect</h2>
            <p class="section-description">
                Save my details or connect with me online.
            </p>

            <button class="button primary-button" id="save-contact">
                Save Contact ↗
            </button>

            <a class="button secondary-button"
               href="mailto:your.email@example.com">
                Send an Email ↗
            </a>
        </section>

        <section class="social-section">
            <h2>Find me online</h2>
            <div class="social-links">
                <a class="social-link"
                   href="https://instagram.com/">Instagram</a>
                <a class="social-link"
                   href="https://facebook.com/">Facebook</a>
                <a class="social-link"
                   href="https://linkedin.com/">LinkedIn</a>
            </div>
        </section>

        <footer>ONE TAP. ONE CONNECTION.</footer>
    </main>
</body>
</html>
